<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <style>
    .terminal {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      fill: #e6edf3;
      white-space: pre;
    }
    .accent {
      fill: #8b949e; 
    }
    
    /* Анимация быстрого построчного появления */
    .line {
      opacity: 0;
      animation: type 0.1s forwards;
    }
    .l1 { animation-delay: 0.1s; }
    .l2 { animation-delay: 0.2s; }
    .l3 { animation-delay: 0.3s; }
    .l4 { animation-delay: 0.4s; }
    .l5 { animation-delay: 0.5s; }
    .l6 { animation-delay: 0.6s; }
    
    @keyframes type {
      to { opacity: 1; }
    }

    /* Мерцающий курсор терминала */
    .cursor {
      display: inline-block;
      fill: #e6edf3;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  
  <rect width="100%" height="100%" fill="#0d1117" rx="6" />

